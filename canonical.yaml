boundaries:
- id: corominas.boundary
  scope_ids:
  - corominas
  text: '## Corominas selection rule


    Use only two to four capability blocks in one resume. Choose the blocks that directly prove the job description''s central
    buying criteria. Do not overload a three-month role by listing the entire system portfolio.


    Every bullet should expose a transferable engineering pattern unless the job explicitly rewards the original operating
    domain. Reconstruct the work around multi-tenancy, validation, human control, orchestration, escalation, cost control,
    generated infrastructure, or hardening.'
