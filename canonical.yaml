- id: corominas.security_response.action.1
  employer_id: corominas
  system_id: corominas.security_response
  kind: action
  text: Led a technical response to a third-party compromise by identifying the vector, auditing automation, sweeping the
    portfolio, and hardening the API surface.
  source_refs:
  - archive_sha256: aa55979958be8f1dc9c247281677658cce491cbc7fabd292bb84150039909460
    start_line: 336
    end_line: 352
    quote: '## Capability block 7: Security response and hardening


      After a third-party system in the portfolio was compromised, Lohith led the technical response. He identified the attack
      vector, audited the automation layer the same day to rule it out with evidence, swept the wider portfolio for the exposure,
      converted the sweep into a passive ongoing scanner, closed findings in the automation''s own API surface, and authored
      the standing security policy.


      Output and impact:


      - Turned a one-off incident investigation into an ongoing posture-monitoring control.

      - Produced evidence that separated the compromised third-party path from the automation layer.

      - Converted incident findings into API hardening and a reusable operating policy.


      Binding boundary:


      - This was response and hardening, not prevention.

      - Use `responded to`, `audited`, `swept`, or `hardened`.

      - Never say Lohith prevented, pre-empted, or detected the breach early.

      - Lohith flagged and escalated client remediation; he did not remediate the compromised client site himself.'
