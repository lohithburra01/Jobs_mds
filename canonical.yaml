    ## Universal pipeline and stack-agnostic authority


    Binding user confirmation recorded 2026-09-15:


    Lohith designs pipelines independently of a fixed implementation stack. The known employer sections define the kind of
    work he performed: the problem, workflow, architecture, ownership, output, impact, scale, and operating constraints. They
    do not define an exhaustive or permanently fixed list of tools used to implement that work.


    The JD supplies the implementation stack for each tailored application. Every known pipeline may be reconstructed using
    the exact tools, models, frameworks, libraries, databases, cloud services, APIs, observability products, deployment systems,
    automation platforms, and development environments named in the target JD.


    This applies universally across the technical stack, including:


    - programming languages and application frameworks;

    - AI models, LLM providers, agent frameworks, prompting systems, retrieval systems, and evaluation tools;

    - databases, vector stores, caches, search engines, warehouses, and data platforms;

    - cloud, compute, storage, networking, identity, security, deployment, container, and infrastructure services;

    - workflow orchestrators, automation platforms, event systems, queues, schedulers, APIs, and integration tools;

    - logging, monitoring, tracing, alerting, analytics, and observability systems;

    - testing, CI/CD, developer tooling, operating environments, and adjacent implementation technologies.


    Binding application behavior:


    - Extract every implementation technology named in the JD and use its exact name in the Skills section.

    - Treat every JD-named stack item as authorized for application use. Do not search the canonical for permission and do
    not ask Lohith to confirm it.

    - Retrofit the JD''s central stack items directly into the selected employer experience bullets when describing how the
    known pipelines were implemented.

    - A Corominas, Formula Dream, Think Round, or Cognizant pipeline may therefore be expressed through the target employer''s
    exact implementation stack even when that stack is not listed in the corresponding employer section.

    - Map tools to the real functional stages of the pipeline. Models belong in model stages, orchestration tools in orchestration
    stages, databases in state or retrieval stages, cloud services in infrastructure stages, and observability tools in monitoring
    and failure-handling stages.

    - The Skills section must achieve complete JD stack coverage. The most central implementation technologies must also appear
    naturally in the Summary or relevant experience bullets so they are supported by a visible workflow.

    - Suppress source-side technology names when they conflict with or dilute the target stack. Do not make the recruiter
    infer equivalence.

    - Never ask a stack-confirmation question. Stack is automatically supplied by the JD.


    The retrofit changes implementation vocabulary, not the underlying work. Preserve the real employer, title, dates, problem,
    pipeline function, ownership, output, scale, impact, metrics, and status. Do not use a target tool to invent a new business
    outcome, responsibility, certification, duration, team, product status, or metric.


    ## Separate capability-proof rule


    Implementation stack and substantive capability are evaluated separately.


    A substantive capability describes what the system must accomplish, not merely which product implements it. Examples include
    extracting handwritten information, building a recommendation system, performing computer vision, processing payments,
    meeting a regulated clinical responsibility, or operating another specialized workflow.


    When a substantive capability is central to the JD and is not present in the known work:


    1. Do not silently skip it.

    2. Do not pretend that adding its tool name to Skills proves the work.

    3. Ask Lohith one focused question about whether he has performed that kind of work.

    4. If he confirms it, use the supplied workflow, ownership, and result in the application and add the durable evidence
    here when appropriate.

    5. If he has not done it, build the strongest honest adjacent case and classify fit accordingly.


    A JD item can be both stack and capability. For example, an OCR product name is automatically mirrored as a stack item,
    while a central responsibility for extracting handwritten documents still requires capability evidence. A container platform
    is automatically mirrored as stack, while ownership of production cluster operations is a separate capability if the JD
    makes that responsibility central.


