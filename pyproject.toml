[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-application-harness"
version = "0.1.0"
description = "Local bounded resume writing with Jev decisions"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "PyYAML>=6,<7", "reportlab>=4,<5", "pypdf>=5,<7"]

[project.scripts]
apply-job = "harness.cli:main"
dev-control = "devcontrol.__main__:main"

[tool.setuptools]
packages = ["harness", "renderer", "devcontrol"]
